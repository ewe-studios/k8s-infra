---
apiVersion: v1
kind: PersistentVolume
metadatas:
  name: local-volume-5g-pv
spec:
  capacity:
    storage: 5g
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-volume-storage
  local:
    path: /mnt/data/some_app
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - local-node
---
