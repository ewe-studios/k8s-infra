kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
  - containerPort: 443
    hostPort: 443
  extraMounts:
    - hostPath: /home/darkstar/k8s-data
      containerPath: /mnt/dev1
- role: worker
  extraMounts:
    - hostPath: /home/darkstar/k8s-data
      containerPath: /mnt/dev1
- role: worker
  extraMounts:
    - hostPath: /home/darkstar/k8s-data
      containerPath: /mnt/dev1
